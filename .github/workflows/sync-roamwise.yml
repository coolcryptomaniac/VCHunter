name: Sync Roamwise public snapshot
on:
  schedule:
    - cron: '25 2 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Refresh public Roamwise facts
        run: python scripts/sync_roamwise_public.py
      - name: Commit changed public snapshot
        run: |
          if git diff --quiet; then
            echo "No public Roamwise changes"
            exit 0
          fi
          git config user.name "vc-hunter-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs/data/roamwise_live.json
          git commit -m "data: refresh public Roamwise snapshot"
          git push
