name: Outreach result
description: Share a fundraising outcome so the team can learn what works
title: "Outreach result: "
labels: [outreach-result]
body:
  - type: input
    id: investor
    attributes: {label: Investor / fund}
    validations: {required: true}
  - type: dropdown
    id: result
    attributes:
      label: Result
      options: [Positive reply, Meeting booked, Passed, No response, Warm intro found]
    validations: {required: true}
  - type: input
    id: route
    attributes: {label: Route used, placeholder: "email / warm intro / LinkedIn / form"}
  - type: textarea
    id: learning
    attributes: {label: What worked / what we learned}
